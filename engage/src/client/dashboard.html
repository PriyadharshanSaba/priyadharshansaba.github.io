<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visitors · last 10 days</title>
<style>
 body{font:16px system-ui;margin:0;padding:16px;max-width:720px;margin-inline:auto}
 .kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kpi{padding:12px;border:1px solid #8884;border-radius:8px}
 .kpi b{display:block;font-size:1.8rem} svg{width:100%;height:120px} .bar{fill:#4c78a8}
 table{width:100%;border-collapse:collapse}td{padding:4px 0;border-bottom:1px solid #8882}td:last-child{text-align:right}
 input,select{font:inherit;padding:6px;margin:0 4px 8px 0}
</style></head><body>
<h1>Visitors</h1>
<form id="f"><input name="api" placeholder="API url" required><input name="site" placeholder="site" required>
<input name="token" type="password" placeholder="admin token" required><button>Load</button></form>
<div id="out"></div>
<script>
const $=s=>document.querySelector(s), esc=t=>Object.assign(document.createElement("i"),{textContent:t}).innerHTML;
const saved=JSON.parse(sessionStorage.getItem("pe")||"{}");
for(const k in saved) $("#f")[k].value=saved[k];
$("#f").onsubmit=async e=>{e.preventDefault();
 const v=Object.fromEntries(new FormData(e.target)); sessionStorage.setItem("pe",JSON.stringify(v));
 const r=await fetch(`${v.api}/stats?site=${encodeURIComponent(v.site)}&days=10`,{headers:{authorization:"Bearer "+v.token}});
 if(!r.ok){$("#out").textContent="Failed: "+r.status;return}
 const s=await r.json(), max=Math.max(1,...s.byDay.map(d=>d.views)), w=100/s.byDay.length;
 const table=(t,rows,k,label)=>`<h3>${t}</h3><table>${rows.map(x=>`<tr><td>${esc(label(x))}</td><td>${x.views}</td></tr>`).join("")||"<tr><td>No data yet</td></tr>"}</table>`;
 $("#out").innerHTML=`<div class="kpis"><div class="kpi"><b>${s.totalViews}</b>views</div><div class="kpi"><b>${s.uniqueVisitors}</b>visitors (approx.)</div></div>
 <svg viewBox="0 0 100 40" preserveAspectRatio="none" role="img" aria-label="Views per day">${s.byDay.map((d,i)=>`<rect class="bar" x="${i*w+.5}" width="${w-1}" y="${40-d.views/max*40}" height="${d.views/max*40}"><title>${d.day}: ${d.views}</title></rect>`).join("")}</svg>
 ${table("Cities",s.topCities,"city",x=>x.city+(x.country?", "+x.country:""))}${table("Countries",s.topCountries,"",x=>x.country)}${table("Pages",s.topPages,"",x=>x.path)}${table("Referrers",s.topReferrers,"",x=>x.referrer)}`;
};
</script></body></html>
